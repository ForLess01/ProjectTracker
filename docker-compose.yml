services:
  postgres:
    image: postgres:16-alpine
    container_name: project_tracker_postgres
    restart: always
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: trackerpassword
      POSTGRES_DB: project_tracker
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
